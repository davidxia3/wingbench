apiVersion: batch/v1
kind: Job
metadata:
  name: wb-validation-followup-20261107c-v3-checks
  namespace: jisenli2
  labels:
    app.kubernetes.io/name: wingbench-jisen-validation
    wingbench-run: wb-validation-followup-20261107c
    wingbench-phase: v3-checks
    wingbench-control: v3-checks
  annotations:
    wingbench/scope: "jisen-validation-only/wb-validation-followup-20261107c; validation-only v3 integration control; not a production episode"
    wingbench/source: "frozen v3 pilot-package.tar.gz sha256:86326a1c06566491cbadb7bd16f5b422ae14562a3365b9b760f0529c2fca9ba1, mounted read-only at /workspace/repo"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wingbench-jisen-validation
        wingbench-run: wb-validation-followup-20261107c
        wingbench-phase: v3-checks
        wingbench-control: v3-checks
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
      - name: ghcr-wb-pull
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: research-common-h100-059.cloud.together.ai
      tolerations:
      - key: capacity.together.ai/pool
        operator: Equal
        value: single-node-only
        effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: v3
        image: ghcr.io/mtilyxuegao/wingbench-adjoint-verify@sha256:268ddf9d46457f9c09cfb670e98256369af633319804cceae666ef9fe754286e
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "/results/wb-validation-followup-20261107c/infra/v3-checks.sh"]
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        resources:
          requests: {cpu: "16", memory: 96Gi}
          limits: {cpu: "16", memory: 96Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: results
          mountPath: /results
        - name: results
          mountPath: /workspace/repo
          subPath: wb-validation-followup-20261107c/v3-source/repo
          readOnly: true
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: wb-verify-results
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
