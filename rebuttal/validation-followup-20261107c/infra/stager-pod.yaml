# Short-lived pod that writes the pinned v3 source archive and the infra scripts to the PVC. Deleted afterwards.
apiVersion: v1
kind: Pod
metadata:
  name: wb-validation-followup-20261107c-stager
  namespace: jisenli2
  labels: {app.kubernetes.io/name: wingbench-jisen-validation, wingbench-run: wb-validation-followup-20261107c-infra, role: stager}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector: {kubernetes.io/hostname: research-common-h100-090.cloud.together.ai}
  imagePullSecrets: [{name: ghcr-wb-pull}]
  securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true}
  containers:
  - name: stager
    image: ghcr.io/mtilyxuegao/wingbench-adjoint-verify@sha256:268ddf9d46457f9c09cfb670e98256369af633319804cceae666ef9fe754286e
    command: [sleep, "3600"]
    resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
    volumeMounts: [{name: results, mountPath: /results}]
  volumes:
  - {name: results, persistentVolumeClaim: {claimName: wb-verify-results}}
