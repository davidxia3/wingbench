apiVersion: batch/v1
kind: Job
metadata:
  name: wb-v5-jisen-001-check-059
  namespace: jisenli2
  labels:
    app.kubernetes.io/name: wingbench-jisen-validation
    wingbench-run: wb-v5-jisen-001-checks
    wingbench-phase: v5-check
    wingbench-node: "059"
  annotations:
    wingbench/scope: "WingBench v5 jisen-001 software/runtime checks only (zero CFD); no pilot authorized"
    wingbench/source: "wingbench-v5-jisen-001.tar.gz sha256:c52cf51239e0bfb618d90a5b8266812137e8639928779ae0a2a62c8dbff0da98, release_sha256 0d501cb205d5d9cfd98a2bb863981f1cf1be716b54ddd39ecd51bc69e5c455ca; handoff root mounted read-only as /workspace (run-checks.sh, check-authorization.json) and /workspace/repo"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wingbench-jisen-validation
        wingbench-run: wb-v5-jisen-001-checks
        wingbench-phase: v5-check
        wingbench-node: "059"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
      - name: ghcr-wb-pull
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: research-common-h100-059.cloud.together.ai
      tolerations:
      - key: capacity.together.ai/pool
        operator: Equal
        value: single-node-only
        effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: check
        image: ghcr.io/mtilyxuegao/wingbench-adjoint-verify@sha256:268ddf9d46457f9c09cfb670e98256369af633319804cceae666ef9fe754286e
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "/results/v5-jisen/infra/v5-check.sh"]
        env:
        - name: WINGBENCH_CHECK_OUT
          value: /results/v5-jisen/checks/node-059-check-001
        - name: WINGBENCH_NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: WINGBENCH_RUN_ID
          value: wb-v5-jisen-001-check-059-001
        resources:
          requests: {cpu: "16", memory: 384Gi}
          limits: {cpu: "16", memory: 384Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: results
          mountPath: /results
        - name: results
          mountPath: /workspace/repo
          subPath: v5-jisen/handoff/wingbench-v5-jisen-001/repo
          readOnly: true
        - name: results
          mountPath: /workspace/run-checks.sh
          subPath: v5-jisen/handoff/wingbench-v5-jisen-001/run-checks.sh
          readOnly: true
        - name: results
          mountPath: /workspace/check-authorization.json
          subPath: v5-jisen/handoff/wingbench-v5-jisen-001/check-authorization.json
          readOnly: true
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: wb-verify-results
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
